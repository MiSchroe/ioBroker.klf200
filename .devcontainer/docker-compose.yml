services:
    iobroker:
        build: ./iobroker
        container_name: iobroker-klf200
        hostname: iobroker-klf200
        # This port is only internal, so we can work on this while another instance of ioBroker is running on the host
        expose:
            - 8081
        volumes:
            - ..:/workspace:cached
            - iobrokerdata-klf200:/opt/iobroker
            # Keep node_modules Linux-native instead of the host's (macOS/Windows) bind-mounted copy,
            # otherwise esbuild/vite fail with "wrong binary" errors.
            - node_modules-klf200:/workspace/node_modules
            - node_modules-src-admin-klf200:/workspace/src-admin/node_modules
        environment:
            - LANG=en_US.UTF-8
            - LANGUAGE=en_US:en
            - LC_ALL=en_US.UTF-8
            - TZ=Europe/Berlin
            - SETGID=1000

    # Reverse proxy to load up-to-date admin sources from the repo
    nginx:
        image: nginx:latest
        depends_on:
            - iobroker
        links:
            - iobroker
        container_name: nginx-klf200
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
            - ..:/workspace:cached
        ports:
            # Make the ioBroker admin available under http://localhost:8082
            - 8082:80

volumes:
    iobrokerdata-klf200:
    node_modules-klf200:
    node_modules-src-admin-klf200:
